<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-label="Skizze der Komponente Schere in drei Schritten: Parallelogramm, Dreieck abgeschnitten, Dreieck umgelegt ergibt Rechteck">
<title>Komponente Schere (Skizze, 3 Schritte)</title>
<g stroke="#333" fill="#cfe3f5" font-family="sans-serif" font-size="11"><polygon points="10,100 40,40 110,40 80,100"/><text x="10" y="125" fill="#111">1 Parallelogramm</text>
<polygon points="140,100 170,40 240,40 210,100" /><line x1="170" y1="40" x2="170" y2="100" stroke-dasharray="4"/><text x="140" y="125" fill="#111">2 Schnitt (←→)</text>
<polygon points="270,100 270,40 340,40 340,100"/><text x="270" y="125" fill="#111">3 Rechteck</text></g>
<text x="10" y="145" font-family="sans-serif" font-size="11" fill="#111">Knöpfe: Schnitt verschieben (Pfeiltasten), „Dreieck umlegen“, Zurück</text></svg>
