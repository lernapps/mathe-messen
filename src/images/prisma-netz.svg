<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" role="img" aria-labelledby="t d">
<title id="t">Netz eines Dreiecksprismas</title>
<desc id="d">Das Netz eines Prismas mit rechtwinkliger Dreiecksgrundfläche: der Mantel ist ein langes Rechteck aus drei Rechtecken mit den Breiten 3 cm, 4 cm und 5 cm. Über dem mittleren Rechteck liegt die Grundfläche G, darunter die Deckfläche.</desc>
<rect width="340" height="280" fill="#fff"/>
<rect x="20" y="70" width="66" height="80" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><text x="53.0" y="114.0" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">3 cm</text><rect x="86" y="70" width="88" height="80" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><text x="130.0" y="114.0" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">4 cm</text><rect x="174" y="70" width="110" height="80" fill="#d3e4f5" stroke="#1f4e79" stroke-width="2.5"/><text x="229.0" y="114.0" font-size="13" font-family="sans-serif" fill="#111" text-anchor="middle">5 cm</text><polygon points="86,70 174,70 86,10" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="100" y="58" font-size="14" font-weight="bold" font-family="sans-serif" fill="#111">G</text><polygon points="86,150 174,150 86,210" fill="#e8f1fb" stroke="#1f4e79" stroke-width="2.5"/><text x="170" y="236" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">Der Mantel ist ein langes Rechteck,</text><text x="170" y="252" font-size="12" font-family="sans-serif" fill="#111" text-anchor="middle">so lang wie der Umfang u.</text><text x="292" y="114.0" font-size="13" font-family="sans-serif" fill="#111">h</text>
<text x="182" y="192" font-size="12" font-family="sans-serif" fill="#111">Deckfläche</text>
</svg>
