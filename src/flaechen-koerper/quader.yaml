# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Volumen und Oberfläche: Quader, Würfel"
description: "Volumen und Oberfläche von Quader und Würfel berechnen: Würfel in Schichten stapeln und das Netz auslegen."
competencies: [volumen-oberflaeche-quader-wuerfel]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Wenn du wissen willst, wie viel in eine Schachtel passt oder wie viel Papier du zum Einpacken brauchst, brauchst du
          Volumen und Oberfläche. Nach dieser Seite berechnest du beides für Quader und Würfel. Das Modell dahinter: Du
          stapelst Würfel in Schichten. Die Zahl der Würfel ist die Zahl der Würfel in einer Schicht mal die Zahl der
          Schichten.
      - type: number
        id: schachtel-wuerfel
        text: "Eine Schachtel ist innen 5 cm lang, 3 cm breit und 2 cm hoch. Wie viele Würfel mit 1 cm Kantenlänge passen genau hinein?"
        answer: 30
        tolerance: 0
        mistakes:
          - answer: 10
            message: "Du hast die drei Maße addiert. Die Würfel füllen die Schachtel in Schichten."
          - answer: 15
            message: "So viele Würfel passen in eine Schicht auf den Boden. Die Schachtel ist aber höher."
        hint: "Wie viele Würfel liegen auf dem Boden? Wie viele Schichten passen übereinander?"
        explanation: "Auf dem Boden liegen $5 \\cdot 3 = 15$ Würfel. Es passen 2 Schichten hinein: $15 \\cdot 2 = 30$ Würfel."
  - type: section
    id: idee
    title: Schichten stapeln, Netz auslegen
    blocks:
      - type: text
        text: |
          Hier ist $a$ die Länge, $b$ die Breite und $c$ die Höhe des Quaders, $G$ die Grundfläche und $h$ die Höhe. Wenn du wissen willst, wie viel in eine Schachtel passt, zählst du Würfel in Schichten. Das **Volumen** sagt, wie viele Einheitswürfel in einen Körper passen. Du zählst Schicht für Schicht: Eine
          Schicht hat so viele Würfel wie die Grundfläche Einheitsquadrate hat. Die Zahl der Schichten ist die Höhe. Erst siehst du eine Schicht, dann den ganzen Stapel.
      - type: figure
        image: images/quader-schicht.svg
        alt: Eine Schicht aus Einheitswürfeln, 4 Würfel lang und 3 Würfel breit, nur 1 Würfel hoch.
        caption: "Eine Schicht: 4 mal 3 Würfel. Das ist die Grundfläche, mit Würfeln belegt."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: figure
        image: images/quader-aus-wuerfeln.svg
        alt: Ein Quader aus Einheitswürfeln, 4 Würfel lang, 3 Würfel breit und 2 Schichten hoch.
        caption: "Eine Schicht hat 4 mal 3 Würfel. Es gibt 2 Schichten."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Grundfläche
        explanation: "Die Grundfläche ist die Fläche, auf der ein Körper steht. Beim Quader mit 4 cm Länge und 3 cm Breite ist sie 12 cm² groß."
      - type: definition
        term: Volumen
        explanation: "Das Volumen sagt, wie viele Einheitswürfel in einen Körper passen. Es hat Einheiten wie cm³ oder m³."
      - type: formula
        formula: 'V = a \cdot b \cdot c = G \cdot h'
      - type: text
        text: |
          Wenn du wissen willst, wie viel Papier du zum Einpacken brauchst, brauchst du die **Oberfläche**. Sie ist die Fläche aller Seitenflächen zusammen. Du legst sie als Netz aus: sechs Rechtecke,
          immer zwei gleich große.
      - type: figure
        image: images/quader-netz.svg
        alt: "Das Netz eines Quaders mit 4 cm Länge, 3 cm Breite und 2 cm Höhe: sechs Rechtecke in Kreuzform. Maße in cm."
        caption: "Das Netz hat drei Paare gleich großer Rechtecke: Boden und Deckel, vorne und hinten, links und rechts."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Netz
        explanation: "Ein Netz entsteht, wenn du einen Körper an Kanten aufschneidest und flach hinlegst. Das Netz eines Quaders besteht aus sechs Rechtecken."
      - type: definition
        term: Oberfläche
        explanation: "Die Oberfläche ist die Summe der Flächen aller Seitenflächen eines Körpers. Sie hat Einheiten wie cm² oder m²."
      - type: formula
        formula: 'O = 2 \cdot (a \cdot b + a \cdot c + b \cdot c)'
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Das Volumen hat die Einheit cm³, die Oberfläche cm². Beim Würfel mit der Kantenlänge $a$ gilt
              $V = a \cdot a \cdot a$ und $O = 6 \cdot a \cdot a$.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Der Quader aus dem Netz
        blocks:
          - type: text
            text: Ein Quader ist 4 cm lang, 3 cm breit und 2 cm hoch. Das Volumen berechnest du so.
          - type: formula
            formula: 'V = 4 \cdot 3 \cdot 2 = 24\ \text{cm}^3'
          - type: text
            text: "Für die Oberfläche addierst du die drei Paare des Netzes: Boden und Deckel je 4 · 3 = 12, vorne und hinten je 4 · 2 = 8, links und rechts je 2 · 3 = 6."
          - type: formula
            formula: 'O = 2 \cdot 12 + 2 \cdot 8 + 2 \cdot 6'
          - type: formula
            formula: 'O = 24 + 16 + 12 = 52\ \text{cm}^2'
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: quader-volumen
        given:
          a: { int: [3, 9] }
          b: { int: [2, 8] }
          c: { int: [2, 6] }
        where: ["a != b", "b != c", "a * b * c != 2 * (a * b + a * c + b * c)"]
        task:
          text: "Ein Quader ist {{a}} cm lang, {{b}} cm breit und {{c}} cm hoch. Berechne das Volumen in cm³."
        answer: { value: "a * b * c", compare: { number: { format: integer, unit: cm³ } } }
        mistakes:
          - {
              value: "a + b + c",
              message: "Du hast die Maße addiert. Die Würfel liegen in Reihen und Schichten, also mal.",
            }
          - {
              value: "2 * (a * b + a * c + b * c)",
              message: "Das ist die Oberfläche. Gefragt ist, wie viele Würfel hineinpassen.",
            }
        hint: "Wie viele Würfel liegen in einer Schicht? Wie viele Schichten gibt es?"
        steps:
          - '$V = a \cdot b \cdot c$'
          - '$V = {{a}} \cdot {{b}} \cdot {{c}} = {{answer}}\ \text{cm}^3$.'
      - type: generated
        id: quader-oberflaeche
        given:
          a: { int: [3, 9] }
          b: { int: [2, 8] }
          c: { int: [2, 6] }
        where: ["a != b", "b != c", "a * b * c != 2 * (a * b + a * c + b * c)", "a * b + a * c + b * c != a * b * c"]
        task:
          text: "Ein Quader ist {{a}} cm lang, {{b}} cm breit und {{c}} cm hoch. Berechne die Oberfläche in cm²."
        answer: { value: "2 * (a * b + a * c + b * c)", compare: { number: { format: integer, unit: cm² } } }
        mistakes:
          - {
              value: "a * b + a * c + b * c",
              message: "Du hast nur drei Seitenflächen gezählt. Jede Fläche gibt es zweimal.",
            }
          - { value: "a * b * c", message: "Das ist das Volumen. Gefragt ist die Fläche aller Seiten." }
        hint: "Das Netz hat sechs Rechtecke. Je zwei sind gleich groß: Boden und Deckel, vorne und hinten, links und rechts."
        steps:
          - 'Boden und Deckel: $2 \cdot {{a}} \cdot {{b}}$.'
          - 'Vorne und hinten: $2 \cdot {{a}} \cdot {{c}}$. Links und rechts: $2 \cdot {{b}} \cdot {{c}}$.'
          - 'Zusammen: ${{answer}}\ \text{cm}^2$.'
      - type: generated
        id: wuerfel-volumen
        given:
          a: { int: [2, 9] }
        where: ["a != 3"]
        task:
          text: "Ein Würfel hat die Kantenlänge {{a}} cm. Berechne das Volumen in cm³."
        answer: { value: "a * a * a", compare: { number: { format: integer, unit: cm³ } } }
        mistakes:
          - { value: "a * a", message: "Das ist die Fläche einer Seite. Für das Volumen brauchst du noch die Höhe." }
          - {
              value: "3 * a",
              message: "Du hast die Kantenlänge verdreifacht. Beim Würfel multiplizierst du drei gleiche Maße.",
            }
        hint: "Beim Würfel sind Länge, Breite und Höhe gleich."
        steps:
          - '$V = a \cdot a \cdot a$'
          - '$V = {{a}} \cdot {{a}} \cdot {{a}} = {{answer}}\ \text{cm}^3$.'
      - type: generated
        id: hoehe-gesucht
        given:
          G: { oneOf: [12, 16, 20, 24] }
          V: { oneOf: [48, 60, 72, 80, 96, 120, 144, 160, 180] }
        where: ["decimals(V / G) == 0", "V / G >= 2", "V / G <= 9", "V / G != G"]
        task:
          text: "Eine Schachtel hat eine Grundfläche von {{G}} cm². Ihr Volumen ist {{V}} cm³. Wie hoch ist die Schachtel in cm?"
        answer: { value: "V / G", compare: { number: { format: integer, unit: cm } } }
        mistakes:
          - { value: "V - G", message: "Du hast abgezogen. Das Volumen ist Grundfläche mal Höhe, also teilst du." }
          - { value: "V * G", message: "Du hast mal gerechnet. Das Volumen ist schon Grundfläche mal Höhe." }
        hint: "Das Volumen ist Grundfläche mal Höhe. Mit welcher Zahl mal {{G}} kommst du auf {{V}}?"
        steps:
          - '$V = G \cdot h$, also $h = V : G$.'
          - "$h = {{V}} : {{G}} = {{answer}}$, also {{answer}} cm."
  - type: section
    id: rueckblick
    title: Das kannst du jetzt
    blocks:
      - type: text
        text: |
          - Flächen- und Volumeneinheiten mit 100 und 1000 umrechnen,
          - Fläche und Umfang von Rechteck, Quadrat und zusammengesetzten Figuren berechnen,
          - Volumen und Oberfläche von Quader und Würfel berechnen.
      - type: generated
        id: wuerfel-oberflaeche
        given:
          a: { int: [2, 9] }
        where: ["a != 6"]
        task:
          text: "Ein Würfel hat die Kantenlänge {{a}} cm. Berechne die Oberfläche in cm²."
        answer: { value: "6 * a * a", compare: { number: { format: integer, unit: cm² } } }
        mistakes:
          - {
              value: "a * a",
              message: "Das ist die Fläche einer einzigen Seite. Ein Würfel hat sechs gleich große Seitenflächen.",
            }
          - { value: "a * a * a", message: "Das ist das Volumen. Gefragt ist die Fläche aller Seiten." }
        hint: "Alle sechs Seitenflächen sind gleich große Quadrate. Wie groß ist eines?"
        steps:
          - 'Eine Seitenfläche: $a \cdot a$. Es gibt sechs.'
          - '$O = 6 \cdot {{a}} \cdot {{a}} = {{answer}}\ \text{cm}^2$.'
