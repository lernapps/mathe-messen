# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Das brauchst du für dieses Kapitel
description: "Wiederholung von ebenen Grundfiguren und von Quader und Würfel, mit Fachbegriffen, Beispielen und je einem Kurztest."
recap: [mathematik/grundfiguren-eben, mathematik/grundkoerper-quader-wuerfel]
blocks:
  - type: section
    id: einstieg
    title: Wofür diese Seite ist
    blocks:
      - type: text
        text: |
          In diesem Kapitel legst du Flächen aus und füllst Körper. Dafür musst du zwei Dinge schon können:
          ebene Grundfiguren und Quader und Würfel. Hier frischst du die Begriffe auf. Mit jedem Kurztest prüfst du,
          ob du es kannst. Es gibt keine Punkte.
  - type: section
    id: grundfiguren
    title: Ebene Grundfiguren
    blocks:
      - type: text
        text: |
          Ich kann ebene Grundfiguren erkennen, benennen und ihre Eigenschaften beschreiben. Für dieses Kapitel
          brauchst du Rechteck und Quadrat.
      - type: figure
        image: images/rechteck-merkmale.svg
        alt: Ein Rechteck mit 5 cm Breite und 3 cm Höhe. An allen vier Ecken ist ein rechter Winkel eingezeichnet.
        caption: Ein Rechteck mit zwei Seitenlängen. Die kleinen Winkelzeichen markieren rechte Winkel.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Seite
        explanation: "Eine Seite ist eine der Strecken, die eine Figur begrenzen. Ein Rechteck hat vier Seiten, zum Beispiel 5 cm, 3 cm, 5 cm und 3 cm."
      - type: definition
        term: Rechter Winkel
        explanation: "Ein rechter Winkel ist eine Ecke wie die Ecke eines Blattes Papier. Er hat 90 Grad."
      - type: definition
        term: Rechteck
        explanation: "Ein Rechteck hat vier Seiten und vier rechte Winkel. Gegenüberliegende Seiten sind gleich lang, zum Beispiel 5 cm und 3 cm."
      - type: definition
        term: Quadrat
        explanation: "Ein Quadrat ist ein Rechteck, bei dem alle vier Seiten gleich lang sind, zum Beispiel 4 cm."
      - type: definition
        term: Parallel
        explanation: "Zwei Seiten sind parallel, wenn sie überall denselben Abstand haben. Im Rechteck sind gegenüberliegende Seiten parallel."
      - type: vue-component
        id: test-rechteck
        component: Kurztest
        props:
          question: Ein Viereck hat vier rechte Winkel. Zwei Seiten sind 3 cm lang, die beiden anderen 5 cm. Welche Figur ist das?
          options:
            - {
                text: "Quadrat",
                correct: false,
                info: "Ein Quadrat hat vier gleich lange Seiten, hier sind es zwei verschiedene Längen.",
              }
            - {
                text: "Rechteck",
                correct: true,
                info: "Vier rechte Winkel und gegenüberliegende Seiten gleich lang: so ist ein Rechteck gebaut.",
              }
            - { text: "Dreieck", correct: false, info: "Ein Dreieck hat nur drei Seiten." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Viereck hat vier rechte Winkel, zwei Seiten sind 3 cm lang, die beiden anderen 5 cm. Antwort: ein Rechteck.
          Ein Quadrat hätte vier gleich lange Seiten, ein Dreieck nur drei Seiten.
      - type: vue-component
        id: test-parallel
        component: Kurztest
        props:
          question: Welche Seiten eines Rechtecks sind parallel?
          options:
            - { text: "Gegenüberliegende Seiten", correct: true, info: "Sie haben überall denselben Abstand." }
            - {
                text: "Benachbarte Seiten",
                correct: false,
                info: "Benachbarte Seiten stoßen in einer Ecke im rechten Winkel aufeinander.",
              }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Welche Seiten eines Rechtecks sind parallel? Antwort: gegenüberliegende Seiten, sie haben überall denselben Abstand.
          Benachbarte Seiten stoßen im rechten Winkel aufeinander.
      - type: text
        text: |
          Wenn du unsicher bist, übe den Baustein „Ebene Grundfiguren“. Seine Kartenseite findest du hier:
          [Karte: Ebene Grundfiguren](https://lernapps.net/apps/map/mathematik/c/grundfiguren-eben/).
  - type: section
    id: quader
    title: Quader und Würfel
    blocks:
      - type: text
        text: |
          Ich kann Quader, Würfel und zusammengesetzte Körper erkennen und beschreiben. Für dieses Kapitel
          brauchst du Quader und Würfel.
      - type: figure
        image: images/quader-merkmale.svg
        alt: Ein Quader. Eine Ecke ist mit E markiert, eine Kante mit K, eine Seitenfläche mit F.
        caption: Ein Quader. E ist eine Ecke, K eine Kante, F eine Seitenfläche.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Quader
        explanation: "Ein Quader ist ein Körper aus sechs Rechtecken, wie eine Schachtel. Er hat 6 Seitenflächen, 12 Kanten und 8 Ecken."
      - type: definition
        term: Würfel
        explanation: "Ein Würfel ist ein Quader, dessen Seitenflächen alle gleich große Quadrate sind. Bei einem Würfel mit 3 cm Kantenlänge sind alle 12 Kanten 3 cm lang."
      - type: definition
        term: Kante
        explanation: "Eine Kante ist eine Linie, an der zwei Seitenflächen zusammenstoßen."
      - type: definition
        term: Ecke
        explanation: "Eine Ecke ist ein Punkt, an dem Kanten zusammentreffen. Ein Quader hat 8 Ecken."
      - type: definition
        term: Seitenfläche
        explanation: "Eine Seitenfläche ist eine ebene Fläche, die den Körper begrenzt. Beim Quader ist jede Seitenfläche ein Rechteck."
      - type: vue-component
        id: test-seitenflaechen
        component: Kurztest
        props:
          question: Wie viele Seitenflächen hat ein Quader?
          options:
            - {
                text: "4",
                correct: false,
                info: "Vier Seitenflächen hat ein Körper wie eine Pyramide mit dreieckiger Grundfläche. Ein Quader hat oben und unten noch je eine.",
              }
            - { text: "6", correct: true, info: "Vorne, hinten, links, rechts, oben und unten: sechs Rechtecke." }
            - { text: "8", correct: false, info: "Acht ist die Zahl der Ecken, nicht die der Seitenflächen." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Wie viele Seitenflächen hat ein Quader? 4, 6 oder 8. Antwort: 6. Es sind vorne, hinten, links, rechts, oben und
          unten je ein Rechteck. Acht ist die Zahl der Ecken.
      - type: vue-component
        id: test-kanten
        component: Kurztest
        props:
          question: Ein Würfel hat eine Kantenlänge von 3 cm. Wie viele Kanten hat er?
          options:
            - { text: "6", correct: false, info: "Sechs ist die Zahl der Seitenflächen." }
            - { text: "8", correct: false, info: "Acht ist die Zahl der Ecken." }
            - { text: "12", correct: true, info: "Vier Kanten oben, vier unten und vier senkrechte, alle 3 cm lang." }
          right: Richtig.
          wrong: Nicht richtig.
        nojs: |
          Kurztest: Ein Würfel hat eine Kantenlänge von 3 cm. Wie viele Kanten hat er? 6, 8 oder 12. Antwort: 12. Vier oben, vier
          unten und vier senkrechte. Sechs ist die Zahl der Seitenflächen, acht die der Ecken.
      - type: text
        text: |
          Wenn du unsicher bist, übe den Baustein „Quader und Würfel“. Seine Kartenseite findest du hier:
          [Karte: Quader und Würfel](https://lernapps.net/apps/map/mathematik/c/grundkoerper-quader-wuerfel/).
  - type: section
    id: bereit
    title: Du bist bereit, wenn du …
    blocks:
      - type: text
        text: |
          - ebene Grundfiguren erkennen, benennen und ihre Eigenschaften beschreiben kannst, vor allem Rechteck und
            Quadrat mit Seiten, rechten Winkeln und parallelen Seiten,
          - Quader, Würfel und zusammengesetzte Körper erkennen und beschreiben kannst, vor allem mit Seitenflächen,
            Kanten und Ecken.
