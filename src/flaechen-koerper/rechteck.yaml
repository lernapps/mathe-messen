# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: "Fläche und Umfang: Rechteck, Quadrat"
description: "Flächeninhalt und Umfang von Rechteck und Quadrat berechnen: aus dem Auslegen mit Einheitsquadraten wird die Formel."
competencies: [flaeche-umfang-quadrat-rechteck]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Nach dieser Seite berechnest du Flächeninhalt und Umfang von Rechteck und Quadrat. Auf der Seite davor hast du
          Einheitsquadrate gezählt. Jetzt zählst du ohne Auslegen. Das Modell dahinter: Ein Rechteck legst du in Reihen aus. Die Zahl der Quadrate ist die Zahl der Reihen mal die Zahl der Quadrate je Reihe.
      - type: number
        id: reihen-zaehlen
        text: "Ein Rechteck ist 5 cm breit und 3 cm hoch. Die oberste Reihe ist mit Einheitsquadraten ausgelegt. Wie viele Einheitsquadrate passen insgesamt hinein?"
        material:
          - type: figure
            image: images/rechteck-eine-reihe.svg
            alt: Ein Rechteck, 5 cm breit und 3 cm hoch. Die oberste Reihe ist mit 5 Einheitsquadraten ausgelegt, der Rest ist leer.
            caption: Eine Reihe liegt schon. Wie viele Reihen passen insgesamt hinein?
            source: eigene Zeichnung
            licence: CC-BY-4.0
        answer: 15
        tolerance: 0
        mistakes:
          - answer: 8
            message: "Du hast 5 und 3 addiert. Jede der Reihen hat gleich viele Quadrate."
          - answer: 5
            message: "So viele liegen schon in der obersten Reihe. Es gibt aber mehr Reihen."
        hint: "Wie viele Reihen gibt es? In jeder Reihe liegen gleich viele Quadrate."
        explanation: "Es gibt 3 Reihen mit je 5 Quadraten: $3 \\cdot 5 = 15$ Einheitsquadrate."
  - type: section
    id: idee
    title: Reihen mal Spalten
    blocks:
      - type: text
        text: |
          Im **Rechteckmodell** liegen Einheitsquadrate in Reihen. Jede Reihe hat so viele Quadrate, wie die Seite $a$
          lang ist, und es gibt so viele Reihen, wie die Seite $b$ lang ist. Das Auslegen kürzt du mit Mal ab.
      - type: figure
        image: images/rechteckmodell.svg
        alt: Ein Rechteck aus Einheitsquadraten, 6 Quadrate in jeder Reihe und 4 Reihen. Die waagerechte Seite heißt a, die senkrechte Seite heißt b.
        caption: Seite $a$ sagt, wie viele Quadrate in einer Reihe liegen. Seite $b$ sagt, wie viele Reihen es sind.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Flächeninhalt
        explanation: "Der Flächeninhalt sagt, wie viele Einheitsquadrate in eine Figur passen. Beim Rechteck mit 6 cm und 4 cm sind es 24 cm²."
      - type: formula
        formula: 'A = a \cdot b'
      - type: definition
        term: Umfang
        explanation: "Der Umfang ist die Länge des Weges einmal um die Figur herum. Beim Rechteck mit 6 cm und 4 cm sind es 20 cm."
      - type: formula
        formula: 'u = 2 \cdot a + 2 \cdot b'
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Der Flächeninhalt hat die Einheit cm², m² und so weiter, der Umfang die Einheit cm, m und so weiter. Bei
              einem Quadrat ist $a = b$, also $A = a \cdot a$ und $u = 4 \cdot a$.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Ein Beet
        blocks:
          - type: text
            text: |
              Ein Beet ist 8 m lang und 5 m breit. Der Flächeninhalt ist $A = 8\ \text{m} \cdot 5\ \text{m} = 40\ \text{m}^2$.
              Der Umfang ist $u = 2 \cdot 8\ \text{m} + 2 \cdot 5\ \text{m} = 26\ \text{m}$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: single-choice
        id: flaeche-oder-umfang
        text: Du willst einen Zaun um ein Rechteck bauen. Was berechnest du?
        options:
          - text: den Flächeninhalt
            correct: false
            info: "Der Flächeninhalt sagt, wie viel Platz im Rechteck ist, zum Beispiel für Rasen. Der Zaun steht am Rand."
          - text: den Umfang
            correct: true
            info: "Der Zaun geht einmal um das Rechteck herum. Das ist der Umfang."
        explanation: Der Zaun läuft am Rand entlang, also brauchst du den Umfang.
      - type: generated
        id: rechteck-flaeche
        given:
          a: { int: [3, 15] }
          b: { int: [2, 12] }
        where: ["a != b", "a * b != 2 * a + 2 * b"]
        task:
          text: "Ein Rechteck ist {{a}} m lang und {{b}} m breit. Berechne den Flächeninhalt in m²."
        answer: { value: "a * b", compare: { number: { format: integer, unit: m² } } }
        mistakes:
          - {
              value: "2 * a + 2 * b",
              message: "Das ist der Umfang. Gefragt ist der Flächeninhalt: Wie viele Einheitsquadrate passen hinein?",
            }
          - { value: "a + b", message: "Du hast addiert. Die Quadrate liegen in Reihen, also mal." }
        hint: "Wie viele Quadrate liegen in einer Reihe, und wie viele Reihen gibt es?"
        steps:
          - '$A = a \cdot b$'
          - '$A = {{a}}\ \text{m} \cdot {{b}}\ \text{m} = {{answer}}\ \text{m}^2$.'
      - type: generated
        id: rechteck-umfang
        given:
          a: { int: [3, 15] }
          b: { int: [2, 12] }
        where: ["a != b", "a * b != 2 * a + 2 * b"]
        task:
          text: "Ein Rechteck ist {{a}} m lang und {{b}} m breit. Berechne den Umfang in m."
        answer: { value: "2 * a + 2 * b", compare: { number: { format: integer, unit: m } } }
        mistakes:
          - {
              value: "a * b",
              message: "Das ist der Flächeninhalt. Gefragt ist der Umfang, also der Rand des Rechtecks.",
            }
          - { value: "a + b", message: "Das ist erst der halbe Rand: Du musst alle vier Seiten zählen." }
        hint: "Gehe einmal am Rand des Rechtecks entlang. Wie viele Seiten kommen vor, und wie lang sind sie?"
        steps:
          - '$u = 2 \cdot a + 2 \cdot b$'
          - '$u = 2 \cdot {{a}}\ \text{m} + 2 \cdot {{b}}\ \text{m} = {{answer}}\ \text{m}$.'
      - type: generated
        id: quadrat-flaeche
        given:
          a: { int: [3, 14] }
        where: ["a != 4"]
        task:
          text: "Ein Quadrat hat die Seitenlänge {{a}} cm. Berechne den Flächeninhalt in cm²."
        answer: { value: "a * a", compare: { number: { format: integer, unit: cm² } } }
        mistakes:
          - { value: "4 * a", message: "Das ist der Umfang. Gefragt ist der Flächeninhalt." }
          - {
              value: "2 * a",
              message: "Du hast die Seitenlänge verdoppelt. Beim Quadrat gibt es so viele Reihen wie Quadrate je Reihe.",
            }
        hint: "Beim Quadrat sind beide Seiten gleich lang. Wie viele Reihen mit wie vielen Quadraten?"
        steps:
          - '$A = a \cdot a$'
          - '$A = {{a}}\ \text{cm} \cdot {{a}}\ \text{cm} = {{answer}}\ \text{cm}^2$.'
      - type: generated
        id: seite-gesucht
        given:
          A: { int: [24, 150] }
          a: { int: [4, 12] }
        where: ["decimals(A / a) == 0", "A / a != a", "A / a >= 2", "A / a <= 20"]
        task:
          text: "Ein Rechteck hat den Flächeninhalt {{A}} cm². Eine Seite ist {{a}} cm lang. Wie lang ist die andere Seite in cm?"
        answer: { value: "A / a", compare: { number: { format: integer, unit: cm } } }
        mistakes:
          - {
              value: "A - a",
              message: "Du hast die Seite abgezogen. Der Flächeninhalt ist ein Produkt, also teilst du.",
            }
          - {
              value: "A * a",
              message: "Du hast mal gerechnet. Der Flächeninhalt ist schon das Produkt der beiden Seiten.",
            }
        hint: "Der Flächeninhalt ist Seite mal Seite. Mit welcher Zahl mal {{a}} kommst du auf {{A}}?"
        steps:
          - '$A = a \cdot b$, also $b = A : a$.'
          - '$b = {{A}}\ \text{cm}^2 : {{a}}\ \text{cm} = {{answer}}\ \text{cm}$.'
      - type: generated
        id: quadrat-umfang
        given:
          a: { int: [3, 15] }
        where: ["a != 4", "a != 2"]
        task:
          text: "Ein Quadrat hat die Seitenlänge {{a}} cm. Berechne den Umfang in cm."
        answer: { value: "4 * a", compare: { number: { format: integer, unit: cm } } }
        mistakes:
          - {
              value: "a * a",
              message: "Das ist der Flächeninhalt. Gefragt ist der Umfang, also der Rand des Quadrats.",
            }
          - { value: "2 * a", message: "Du hast nur zwei Seiten gezählt. Ein Quadrat hat vier Seiten." }
        hint: "Der Rand des Quadrats führt an vier gleich langen Seiten entlang."
        steps:
          - 'Ein Quadrat hat vier gleich lange Seiten: $u = 4 \cdot a$.'
          - '$u = 4 \cdot {{a}}\ \text{cm} = {{answer}}\ \text{cm}$.'
