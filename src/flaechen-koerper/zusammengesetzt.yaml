# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Zusammengesetzte Figuren
description: "Fläche und Umfang zusammengesetzter Figuren berechnen: in Rechtecke zerlegen oder zu einem Rechteck ergänzen."
competencies: [zusammengesetzte-figuren]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Nach dieser Seite berechnest du Fläche und Umfang von Figuren, die keine Rechtecke sind, aber aus Rechtecken
          bestehen. Du nutzt, was du über Rechtecke weißt.
      - type: number
        id: schrank-flaeche
        text: "Ein Zimmer ist 10 m lang und 6 m breit. In einer Ecke liegt ein Teppich mit den Maßen 4 m mal 2 m. Wie viele m² Boden sind nicht vom Teppich bedeckt?"
        answer: 52
        tolerance: 0
        unit: m²
        mistakes:
          - answer: 60
            message: "Das ist der Boden des ganzen Zimmers. Ein Teil davon ist vom Teppich bedeckt."
          - answer: 68
            message: "Du hast die Fläche des Teppichs zum Zimmer addiert. Der Teppich liegt auf dem Boden des Zimmers und gehört nicht dazu."
        hint: "Berechne die Fläche des Zimmers und die Fläche des Teppichs. Was machst du mit dem Teppich?"
        explanation: "Das Zimmer hat $10 \\cdot 6 = 60$ m², der Teppich $4 \\cdot 2 = 8$ m². Frei bleiben $60 - 8 = 52$ m²."
  - type: section
    id: idee
    title: Zerlegen oder ergänzen
    blocks:
      - type: text
        text: |
          Eine Figur, die nicht rechteckig ist, bringst du auf Rechtecke zurück. Du hast zwei Wege. Du **zerlegst** sie
          in Rechtecke und addierst die Flächen. Oder du **ergänzt** sie zu einem großen Rechteck und ziehst das
          Ergänzte ab.
      - type: figure
        image: images/l-figur-zerlegt.svg
        alt: "Eine L-förmige Figur: unten 8 m breit, links 6 m hoch, oben nur 4 m breit, der rechte Teil ist 3 m hoch. Eine gestrichelte Linie teilt sie in Teil 1 oben links und Teil 2 unten."
        caption: "Die gestrichelte Linie zerlegt die Figur in Teil 1 (4 m mal 3 m) und Teil 2 (8 m mal 3 m)."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: figure
        image: images/l-figur-ergaenzt.svg
        alt: Die L-förmige Figur. Das fehlende Rechteck oben rechts, 4 m mal 3 m, ist gestrichelt eingezeichnet. Figur und Ergänzung bilden zusammen ein Rechteck von 8 m mal 6 m.
        caption: Die gestrichelte Ergänzung macht aus der Figur ein Rechteck. Von dessen Fläche ziehst du die Ergänzung ab.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Zusammengesetzte Figur
        explanation: "Eine zusammengesetzte Figur besteht aus mehreren einfachen Figuren, zum Beispiel aus zwei Rechtecken. Du berechnest jede einzeln."
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Beim Umfang zählst du nur den Rand der ganzen Figur. Die Schnittlinie, mit der du zerlegt hast, gehört
              nicht dazu.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Die L-förmige Figur
        blocks:
          - type: text
            text: |
              Zerlegen: Teil 1 hat $4 \cdot 3 = 12$ m², Teil 2 hat $8 \cdot 3 = 24$ m². Zusammen sind es 36 m².
              Ergänzen: Das große Rechteck hat $8 \cdot 6 = 48$ m². Das fehlende Stück hat $4 \cdot 3 = 12$ m². Es bleiben 36 m². Beide Wege geben dieselbe Zahl.
              Der Umfang ist $4 + 3 + 4 + 3 + 8 + 6 = 28$ m. Das ist auch $2 \cdot (8 + 6)$ m: Eine ausgeschnittene Ecke ändert den Umfang nicht.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: generated
        id: l-flaeche
        given:
          W: { int: [8, 14] }
          H: { int: [6, 10] }
          w: { int: [2, 6] }
          h: { int: [2, 4] }
        where: ["w < H", "h < H", "w * h != W * H - w * h"]
        task:
          text: "Eine L-förmige Terrasse entsteht aus einem Rechteck von {{W}} m mal {{H}} m. Aus einer Ecke ist ein Rechteck von {{w}} m mal {{h}} m herausgeschnitten. Berechne den Flächeninhalt in m²."
        answer: { value: "W * H - w * h", compare: { number: { format: integer, unit: m² } } }
        mistakes:
          - {
              value: "W * H",
              message: "Das ist die Fläche des großen Rechtecks. Das herausgeschnittene Stück gehört nicht zur Terrasse.",
            }
          - {
              value: "W * H + w * h",
              message: "Du hast das herausgeschnittene Stück addiert. Es fehlt in der Figur, du musst es abziehen.",
            }
          - { value: "w * h", message: "Das ist nur das herausgeschnittene Stück." }
        hint: "Berechne die Fläche des großen Rechtecks. Das herausgeschnittene Stück ist nicht Teil der Terrasse."
        steps:
          - 'Großes Rechteck: ${{W}}\ \text{m} \cdot {{H}}\ \text{m}$.'
          - 'Herausgeschnitten: ${{w}}\ \text{m} \cdot {{h}}\ \text{m}$. Die Terrasse hat ${{answer}}\ \text{m}^2$.'
      - type: generated
        id: l-umfang
        given:
          W: { int: [8, 14] }
          H: { int: [6, 10] }
          w: { int: [2, 6] }
          h: { int: [2, 4] }
        where: ["w < H", "h < H", "W * H - w * h != 2 * (W + H)", "2 * (2 * W + H - w) != W * H - w * h"]
        task:
          text: "Eine L-förmige Terrasse entsteht aus einem Rechteck von {{W}} m mal {{H}} m. Aus einer Ecke ist ein Rechteck von {{w}} m mal {{h}} m herausgeschnitten. Berechne den Umfang in m."
        answer: { value: "2 * (W + H)", compare: { number: { format: integer, unit: m } } }
        mistakes:
          - {
              value: "2 * (2 * W + H - w)",
              message: "Du hast die Umfänge der beiden Teilrechtecke addiert. Die Schnittlinie liegt aber im Inneren und gehört nicht zum Rand.",
            }
          - { value: "W * H - w * h", message: "Das ist der Flächeninhalt. Gefragt ist der Weg um die Terrasse." }
        hint: "Gehe in Gedanken einmal am Rand entlang. Wie lang sind die sechs Randstücke zusammen?"
        steps:
          - 'Rand: $2 \cdot ({{W}}\ \text{m} + {{H}}\ \text{m})$.'
          - 'Der Ausschnitt in der Ecke ändert den Weg nicht: ${{answer}}\ \text{m}$.'
      - type: generated
        id: zwei-rechtecke
        given:
          a: { int: [4, 10] }
          b: { int: [2, 6] }
          c: { int: [3, 8] }
          d: { int: [2, 5] }
        where: ["a != c", "b != d", "(a + c) * (b + d) != a * b + c * d"]
        task:
          text: "Eine Terrasse besteht aus zwei Rechtecken. Das erste ist {{a}} m mal {{b}} m groß, das zweite {{c}} m mal {{d}} m. Berechne die gesamte Fläche in m²."
        answer: { value: "a * b + c * d", compare: { number: { format: integer, unit: m² } } }
        mistakes:
          - {
              value: "(a + c) * (b + d)",
              message: "Du hast alle Längen addiert und dann mal gerechnet. Jedes Rechteck hat seine eigene Fläche.",
            }
          - {
              value: "a * b * c * d",
              message: "Du hast alle Maße multipliziert. Berechne zwei Flächen und addiere sie.",
            }
        hint: "Berechne beide Flächen einzeln. Was machst du dann mit ihnen?"
        steps:
          - 'Erstes Rechteck: ${{a}} \cdot {{b}}$ m².'
          - 'Zweites Rechteck: ${{c}} \cdot {{d}}$ m². Zusammen: ${{answer}}\ \text{m}^2$.'
      - type: true-false
        id: schnittlinie-umfang
        text: "Stimmt das? Beim Umfang einer zerlegten Figur zählt auch die Schnittlinie mit."
        answer: false
        explanation: "Die Schnittlinie liegt im Inneren der Figur. Der Umfang ist nur der Weg um die ganze Figur."
