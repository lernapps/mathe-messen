# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Flächen- und Volumeneinheiten
description: "Flächen- und Volumeneinheiten umrechnen: mit Einheitsquadraten und Einheitswürfeln zählen, warum 100 und 1000 gilt."
competencies: [einheiten-flaeche-volumen]
blocks:
  - type: section
    id: einstieg
    title: Was du hier lernst
    blocks:
      - type: text
        text: |
          Nach dieser Seite rechnest du Flächen- und Volumeneinheiten um und schätzt ihre Größe. Auf der Seite davor hast
          du Längen umgerechnet. Hier kommt eine Richtung dazu. Eine Fläche misst du mit Quadraten von 1 cm Seitenlänge, den Einheitsquadraten. Wie viele davon in eine Fläche passen, ist ihr Maß.
      - type: number
        id: quadrate-zaehlen
        text: "Ein Quadrat ist 10 cm lang und 10 cm breit. Wie viele kleine Quadrate mit 1 cm Seitenlänge passen genau hinein?"
        answer: 100
        tolerance: 0
        mistakes:
          - answer: 20
            message: "Du hast 10 und 10 addiert. Die Quadrate füllen eine Fläche, nicht nur eine Linie."
          - answer: 40
            message: "Das ist der Umfang, die Länge um das Quadrat. Gefragt ist, wie viele Quadrate hineinpassen."
        hint: "Lege in Gedanken eine Reihe aus. Wie viele Reihen passen übereinander?"
        explanation: "In jeder Reihe liegen 10 Quadrate, und es gibt 10 Reihen: $10 \\cdot 10 = 100$."
  - type: section
    id: idee
    title: Einheitsquadrat und Einheitswürfel
    blocks:
      - type: text
        text: |
          Flächen misst du mit **Einheitsquadraten**: Ein Quadrat mit 1 cm Seitenlänge hat die Fläche 1 cm². Körper
          misst du mit **Einheitswürfeln**: Ein Würfel mit 1 cm Kantenlänge hat das Volumen 1 cm³.
      - type: figure
        image: images/quadratdezimeter.svg
        alt: Ein Quadrat von 10 cm mal 10 cm, aufgeteilt in 100 kleine Quadrate von 1 cm mal 1 cm. Ein kleines Quadrat oben links ist markiert und mit 1 cm² beschriftet.
        caption: "Ein Quadrat mit 10 cm Seitenlänge ist 1 dm² groß. Das markierte Einheitsquadrat ist 1 cm²."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: definition
        term: Einheitsquadrat
        explanation: "Ein Einheitsquadrat ist ein Quadrat mit der Seitenlänge 1 Einheit, zum Beispiel 1 cm. Seine Fläche ist 1 cm²."
      - type: definition
        term: Einheitswürfel
        explanation: "Ein Einheitswürfel ist ein Würfel mit der Kantenlänge 1 Einheit, zum Beispiel 1 cm. Sein Volumen ist 1 cm³."
      - type: figure
        image: images/kubikdezimeter.svg
        alt: Ein Würfel mit 10 cm Kantenlänge. Die Vorderseite ist in 10 mal 10 Quadrate geteilt. Ein Würfel von 1 cm Kantenlänge unten links ist markiert. Der Würfel besteht aus 10 Schichten mit je 100 solchen Würfeln.
        caption: "Ein Würfel mit 10 cm Kantenlänge ist 1 dm³ groß. In jeder Schicht liegen 100 Einheitswürfel."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Die Treppe für Fläche und Volumen
        header: [Größe, Umrechnung]
        rowHeaders: true
        rows:
          - [Fläche, "1 dm² = 100 cm² und 1 m² = 100 dm²"]
          - [Volumen, "1 dm³ = 1000 cm³ und 1 m³ = 1000 dm³"]
          - [Hohlmaß, "1 l = 1 dm³"]
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Bei Längen rechnest du mit 10. Bei Flächen kommt eine Richtung dazu: 10 · 10 = 100. Bei Volumen
              sind es drei Richtungen: 10 · 10 · 10 = 1000.
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Von m² zu dm²
        blocks:
          - type: text
            text: |
              Wie viele dm² sind 3 m²? Auf der Treppe geht es eine Stufe nach unten, also mal 100. Es gilt
              $3\ \text{m}^2 \cdot 100 = 300\ \text{dm}^2$.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: einheit-zuordnen
        text: Welche Einheit passt zu welcher Sache?
        pairs:
          - { left: Fläche einer Briefmarke, right: cm² }
          - { left: Fläche eines Klassenzimmers, right: m² }
          - { left: Inhalt eines Schwimmbeckens, right: m³ }
        distractors: [cm³]
        explanation: Eine Fläche misst du in Quadratzentimetern oder Quadratmetern. Ein Schwimmbecken füllst du mit Wasser, das ist ein Volumen in Kubikmetern.
      - type: true-false
        id: m2-in-cm2
        text: "Stimmt das? 1 m² sind 100 cm²."
        answer: false
        explanation: "1 m² sind 100 dm², und 1 dm² sind 100 cm². Zusammen sind das 100 · 100 = 10 000 cm²."
      - type: generated
        id: dm2-in-cm2
        given:
          a: { oneOf: [2, 5, 12, 3.5, 0.4] }
        task:
          text: "Rechne in cm² um: {{a}} dm²."
        answer: { value: "a * 100", compare: { number: { format: decimal, unit: cm² } } }
        mistakes:
          - { value: "a * 10", message: "Das ist der Faktor für eine Länge. Bei Flächen ist der Faktor 100." }
          - { value: "a * 1000", message: "Der Faktor 1000 gilt für Volumen. Bei Flächen ist er 100." }
        hint: "Von dm² zur kleineren Einheit cm² geht es eine Stufe nach unten: mal 100."
        steps:
          - "Eine Stufe nach unten bei Flächen: mal 100."
          - '${{a}}\ \text{dm}^2 \cdot 100 = {{answer}}\ \text{cm}^2$.'
      - type: generated
        id: dm3-in-cm3
        given:
          a: { oneOf: [2, 4, 7, 1.5, 0.3] }
        task:
          text: "Rechne in cm³ um: {{a}} dm³."
        answer: { value: "a * 1000", compare: { number: { format: decimal, unit: cm³ } } }
        mistakes:
          - { value: "a * 100", message: "Der Faktor 100 gilt für Flächen. Bei Volumen ist er 1000." }
          - { value: "a / 1000", message: "Du hast geteilt. Von dm³ zur kleineren Einheit cm³ rechnest du mal." }
        hint: "Von dm³ nach cm³ geht es eine Stufe nach unten: mal 1000."
        steps:
          - "Eine Stufe nach unten bei Volumen: mal 1000."
          - '${{a}}\ \text{dm}^3 \cdot 1000 = {{answer}}\ \text{cm}^3$.'
      - type: generated
        id: cm2-in-dm2
        given:
          a: { oneOf: [300, 500, 1200, 850, 2000] }
        task:
          text: "Rechne in dm² um: {{a}} cm²."
        answer: { value: "a / 100", compare: { number: { format: decimal, unit: dm² } } }
        mistakes:
          - {
              value: "a * 100",
              message: "Du hast mal gerechnet. Von der kleineren Einheit cm² zur größeren dm² geht es die Treppe nach oben: durch 100.",
            }
          - { value: "a / 10", message: "Der Faktor 10 gilt nur für Längen. Bei Flächen teilst du durch 100." }
        hint: "Von cm² nach dm² geht es eine Stufe nach oben: durch 100."
        steps:
          - "Eine Stufe nach oben bei Flächen: durch 100."
          - '${{a}}\ \text{cm}^2 : 100 = {{answer}}\ \text{dm}^2$.'
      - type: generated
        id: m2-umrechnen
        given:
          a: { oneOf: [2, 3, 5, 0.5, 1.5] }
        task:
          text: "Rechne in cm² um: {{a}} m²."
        answer: { value: "a * 10000", compare: { number: { format: decimal, unit: cm² } } }
        mistakes:
          - {
              value: "a * 100",
              message: "Das ist erst dm². Von m² nach cm² sind es zwei Stufen, jede mit dem Faktor 100.",
            }
          - { value: "a * 1000", message: "Der Faktor 1000 gilt für Volumen. Bei Flächen ist jede Stufe mal 100." }
        hint: "Von m² nach dm² mal 100, von dm² nach cm² noch einmal mal 100."
        steps:
          - 'Erste Stufe: ${{a}}\ \text{m}^2 \cdot 100$ in dm².'
          - 'Zweite Stufe: noch einmal mal 100. Zusammen ${{a}}\ \text{m}^2 \cdot 10000 = {{answer}}\ \text{cm}^2$.'
      - type: generated
        id: liter-in-dm3
        given:
          a: { oneOf: [3, 8, 12, 25, 40] }
        task:
          text: "Ein Aquarium fasst {{a}} Liter. Wie viele dm³ sind das?"
        answer: { value: "a", compare: { number: { format: integer, unit: dm³ } } }
        mistakes:
          - {
              value: "a * 1000",
              message: "Du hast mit 1000 gerechnet, wie bei der Umrechnung von dm³ in cm³. Hier musst du nichts umrechnen.",
            }
          - { value: "a / 10", message: "Ein Liter und ein Kubikdezimeter sind gleich groß." }
        hint: "Ein Liter ist ein Würfel von 10 cm Kantenlänge. Wie groß ist er in dm³?"
        steps:
          - "1 l = 1 dm³."
          - '${{a}}\ \text{l} = {{answer}}\ \text{dm}^3$.'
